name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Elixir
        run: sudo apt-get update -qq && sudo apt-get install -y -qq elixir
      - name: Tests
        run: mix test
      - name: Build
        run: mix escript.build
      - name: Sample outputs are up to date
        run: |
          make sample
          git diff --exit-code -- examples docs site
