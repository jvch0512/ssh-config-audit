name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Elixir
        run: sudo apt-get update -qq && sudo apt-get install -y -qq elixir
      - name: Tests
        run: mix test
      - name: Build
        run: mix escript.build
      - name: Sample outputs are up to date
        run: |
          make sample
          git diff --exit-code -- examples docs site
